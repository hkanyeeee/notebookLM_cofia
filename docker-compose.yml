
networks:
  localnet:
    name: localnet
    driver: bridge
    external: true

services:
  embedding-gateway:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: embedding-gateway
    ports:
      - "7998:7998"
    command: ["python", "embedding_gateway.py"]
    environment:
      - EMBEDDING_BACKENDS=${EMBEDDING_BACKENDS:-http://192.168.31.98:7998/v1,http://192.168.31.231:7998/v1,http://host.docker.internal:7988/v1}
    networks:
      - localnet

  llm-gateway:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: llm-gateway
    ports:
      - "7995:7995"
    command: ["python", "llm_gateway.py"]
    environment:
      - LLM_BACKENDS=${LLM_BACKENDS:-http://192.168.31.98:1234/v1,http://192.168.31.231:1234/v1,http://192.168.31.60:1234/v1}
      - LLM_GATEWAY_HOST=0.0.0.0
      - LLM_GATEWAY_PORT=7995
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
    networks:
      - localnet
